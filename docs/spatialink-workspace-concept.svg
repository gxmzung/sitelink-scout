<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
<title id="title">SPATIALINK 건축 공간 분석 화면 시안</title>
<desc id="desc">가상의 12m × 8m 평면도와 측정점, 시나리오 및 상세 패널을 표현한 UI 시안입니다. 실제 건축 도면이나 실측 RF 데이터가 아닙니다.</desc>
